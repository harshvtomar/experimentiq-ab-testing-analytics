name: ExperimentIQ checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -m 'not integration' -q
  authentic-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Acquire and validate authentic data (failure is not a skip)
        run: python -m src.pipeline
      - name: Reproduce statistical inference
        run: python -m src.statistical_pipeline
      - run: python -m pytest -m integration -q
        env:
          EXPERIMENTIQ_REQUIRE_DATA: '1'
